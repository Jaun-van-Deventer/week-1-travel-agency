<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ocean-blue rounded square, the same blue as --color-ocean -->
  <rect width="64" height="64" rx="14" fill="#0b4f6c"/>
  <!-- Sunset-orange sun, the same orange as --color-sunset -->
  <circle cx="32" cy="15" r="6.5" fill="#e8743b"/>
  <!-- White "W" drawn as a line, so it looks the same on every device (no font needed) -->
  <polyline points="12,24 22,52 32,34 42,52 52,24" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
